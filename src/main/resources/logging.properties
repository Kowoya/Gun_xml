# java.util.logging configuration
# Messages go to the console (INFO and above) and to logs/gun-app.log (FINE and above).

handlers = java.util.logging.ConsoleHandler, java.util.logging.FileHandler

# Default level for third-party code; our packages are more detailed
.level = WARNING
ua.knu.gun.level = FINE

java.util.logging.ConsoleHandler.level = INFO
java.util.logging.ConsoleHandler.encoding = UTF-8
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter

java.util.logging.FileHandler.level = FINE
java.util.logging.FileHandler.pattern = logs/gun-app.log
java.util.logging.FileHandler.limit = 1048576
java.util.logging.FileHandler.count = 3
java.util.logging.FileHandler.append = true
java.util.logging.FileHandler.encoding = UTF-8
java.util.logging.FileHandler.formatter = java.util.logging.SimpleFormatter

# 2026-10-31 18:05:12 [INFO] ua.knu.gun.GunApplication.run - message
java.util.logging.SimpleFormatter.format = %1$tF %1$tT [%4$s] %2$s - %5$s%6$s%n
